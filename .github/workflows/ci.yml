name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets a release be gated on a green run without pushing anything.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in engines; 22 is what most users are on.
        node: ["20", "22"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The package is consumed as `npx apuchat`, so the built entrypoint has to
      # actually run — a tsc-clean build that throws on import would still ship.
      - run: node dist/cli.js --version
      - run: node dist/cli.js --help
